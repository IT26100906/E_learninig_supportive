# =====================================================================
#  LearnHub - DATABASE SETTINGS
#  Now set to MySQL / MariaDB (XAMPP) so everything shows up in phpMyAdmin.
#  Database name: learnhub   (created automatically, tables too)
# =====================================================================

# ---- ACTIVE: MySQL / MariaDB (XAMPP, MySQL Workbench, phpMyAdmin ...) ----
# 1) Start MySQL in the XAMPP Control Panel   2) change db.user / db.password below if yours are different
db.type=mysql
db.url=jdbc:mysql://localhost:3306/learnhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# Base address of phpMyAdmin (used by the admin "phpMyAdmin" link / button)
db.phpmyadmin=http://localhost/phpmyadmin

# ---- Option 2: H2 embedded database (no MySQL needed; NOT visible in phpMyAdmin) ----
# To use it: put a # in front of the 4 lines above that start with db.type / db.url, and remove the # from the next line.
#db.type=h2
